name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: canary
        options: [canary, beta, stable]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.channel }}
    outputs:
      channel: ${{ steps.channel.outputs.value }}
    steps:
      - id: channel
        run: echo "value=${{ github.event_name == 'push' && 'stable' || inputs.channel }}" >> "$GITHUB_OUTPUT"
      - name: Fail closed for stable
        env:
          CHANNEL: ${{ steps.channel.outputs.value }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ "$CHANNEL" = stable ] && { [[ "${GITHUB_REF}" != refs/tags/v* ]] || [ -z "$TAURI_UPDATER_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ]; }; then
            echo "Stable releases require a v* tag, protected production environment, updater public key, signing, and notarization credentials." >&2
            exit 1
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-13
            name: macos-intel
          - os: macos-latest
            name: macos-apple-silicon
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    environment: ${{ needs.preflight.outputs.channel == 'stable' && 'production' || needs.preflight.outputs.channel }}
    env:
      K0_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: npm ci
      - run: npm run release:check
      - id: config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-release-config.mjs >> "$GITHUB_OUTPUT"
      - name: Materialize macOS notarization key
        if: runner.os == 'macOS'
        shell: bash
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build signed updater artifacts
        run: npm exec tauri -- build --config "${{ steps.config.outputs.path }}"
      - name: Create checksums and provenance manifest
        run: node scripts/release-artifacts.mjs apps/product/src-tauri/target/release/bundle
      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Keylessly sign provenance with GitHub OIDC
        shell: bash
        run: cosign sign-blob --yes --bundle apps/product/src-tauri/target/release/bundle/provenance.bundle apps/product/src-tauri/target/release/bundle/provenance.json
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: apps/product/src-tauri/target/release/bundle/**
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: apps/product/src-tauri/target/release/bundle
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.channel == 'stable' && 'production' || needs.preflight.outputs.channel }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
      - name: Verify signed provenance bundles
        run: find release-artifacts -name provenance.bundle -print -quit | grep .
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ needs.preflight.outputs.channel != 'stable' }}
          generate_release_notes: true
          files: release-artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
