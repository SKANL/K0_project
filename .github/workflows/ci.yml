name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos-intel
            os: macos-13
          - name: macos-apple-silicon
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify committed Convex generated output
        shell: bash
        run: |
          set -euo pipefail
          generated_files=(
            convex/_generated/api.d.ts
            convex/_generated/api.js
            convex/_generated/dataModel.d.ts
            convex/_generated/server.d.ts
            convex/_generated/server.js
          )
          for file in "${generated_files[@]}"; do
            test -s "$file"
            git ls-files --error-unmatch -- "$file" > /dev/null
          done
          git diff --exit-code -- convex/_generated
      - run: npm run build:product
      - run: cargo fmt --manifest-path apps/product/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path apps/product/src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path apps/product/src-tauri/Cargo.toml --locked
      - run: npm run smoke:release -- --ci
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: k0-${{ matrix.name }}-build
          if-no-files-found: warn
          path: |
            apps/product/dist

  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file apps/product/src-tauri/Cargo.lock
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: k0-sbom
